[package]
name = "difc-worker"
version = "0.0.1"
edition = "2021"
description = "serenity_worker_difc — serenity-server IPC worker that runs the Diffusion Compiler's native process chains"

[[bin]]
name = "serenity_worker_difc"
path = "src/main.rs"

[dependencies]
difc-config = { path = "../difc-config" }
serenity-wire = { path = "../wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
